<!DOCTYPE html>
<html>
    <head>
        <title>
            Email Tone Fixer
        </title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <textarea id="emailInput" rows="10" placeholder="Write your email here..."></textarea>

        <label for="tone">Choose tone:</label>

        <select id="tone">
            <option value="formal">Formal</option>
            <option value="professional">Professional</option>
            <option value="casual">Casual</option>
            <option value="friendly">Friendly</option>
        </select>

        <label for="recipient">Choose Recipient:</label>

        <select id="recipient">
            <option value="manager">Manager</option>
            <option value="Client">Client</option>
            <option value="Recruiter">Recruiter</option>
            <option value="Coworker">Coworker</option>
        </select>

        <button id="submit">Prompt Email</button>

        <textarea id="emailOutput" rows="10" placeholder="Waiting to generate new email..."></textarea>
        <script src="script.js"></script>
    </body>
</html>
